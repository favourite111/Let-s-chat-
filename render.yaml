services:
  - type: web
    name: videocall
    runtime: node
    # Render's filesystem is ephemeral, so rooms are stored in Postgres rather
    # than SQLite. The database below is created from this blueprint and its
    # connection string is injected as DATABASE_URL automatically.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      PORT=5173 BASE_PATH=/ pnpm --filter @workspace/video-call run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    # One instance: presence is in-process. Scale out only after adding
    # REDIS_URL, which attaches the Socket.IO Redis adapter automatically.
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: 8080
      - key: TRUST_PROXY
        value: 1
      # Postgres is mandatory here — with STORE=postgres the server refuses to
      # boot if the database is unreachable, instead of quietly falling back to
      # a SQLite file that Render wipes on the next deploy.
      - key: STORE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: videocall-db
          property: connectionString
      # Set this to your Render URL once you know it, e.g.
      # https://videocall.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # TURN relay — strongly recommended for mobile networks. Set these in the
      # dashboard (they are secrets):
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

databases:
  - name: videocall-db
    databaseName: videocall
    plan: free
