services:
  - type: web
    name: videocall
    # Docker, not the native Node runtime. This is what Render was already
    # doing (it found ./Dockerfile on its own), so being explicit means the
    # Blueprint and the live service agree. To use Render's native runtime
    # instead, change this to `runtime: node` and set:
    #   buildCommand: corepack enable && pnpm install --frozen-lockfile &&
    #     PORT=5173 BASE_PATH=/ pnpm --filter @workspace/video-call run build &&
    #     pnpm --filter @workspace/api-server run build
    #   startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    # One instance: presence is in-process. Scale out only after adding
    # REDIS_URL, which attaches the Socket.IO Redis adapter automatically.
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      # NOTE: PORT is deliberately absent. Render injects it (default 10000)
      # and overrides the image's ENV. Pinning a different value here is the
      # classic cause of "no open ports detected".
      #
      # Render's filesystem is ephemeral, so rooms go to Postgres, not SQLite.
      # STORE=postgres makes the server refuse to boot if the database is
      # unreachable instead of quietly writing to a file that Render wipes on
      # the next deploy.
      - key: STORE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: videocall-db
          property: connectionString
      # Set this to your Render URL once you know it, e.g.
      # https://videocall.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # TURN relay — required for calls to connect on mobile data and across
      # restrictive networks. See docs/DEPLOY-TURN.md.
      #
      # TURN_SECRET is the shared secret from coturn (or your provider); the
      # app mints a short-lived credential per request, so no fixed password
      # is ever handed to clients. Set both in the dashboard.
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
      # Hosted providers that issue a fixed username/password instead of a
      # secret: set these two instead of TURN_SECRET.
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

databases:
  - name: videocall-db
    databaseName: videocall
    plan: free
